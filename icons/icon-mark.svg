<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c4cf1"/>
      <stop offset="1" stop-color="#ff7a59"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd84d"/>
      <stop offset="1" stop-color="#f0a500"/>
    </linearGradient>
    <path id="spade" d="M0,-50 C20,-25 50,-10 50,12 C50,32 30,42 14,34 C10,32 6,28 4,24 C6,38 12,48 22,54 L-22,54 C-12,48 -6,38 -4,24 C-6,28 -10,32 -14,34 C-30,42 -50,32 -50,12 C-50,-10 -20,-25 0,-50 Z"/>
    <path id="heart" d="M0,50 C-40,20 -55,-5 -45,-28 C-35,-48 -8,-46 0,-25 C8,-46 35,-48 45,-28 C55,-5 40,20 0,50 Z"/>
    <path id="diamond" d="M0,-52 L38,0 L0,52 L-38,0 Z"/>
    <g id="club">
      <circle cx="0" cy="-24" r="23"/><circle cx="-25" cy="8" r="23"/><circle cx="25" cy="8" r="23"/>
      <path d="M-7,6 C-7,30 -12,42 -22,52 L22,52 C12,42 7,30 7,6 Z"/>
    </g>
    <g id="suits">
      <use href="#spade" transform="translate(-7 -7) scale(0.12)" fill="#1b1530"/>
      <use href="#heart" transform="translate(7 -7) scale(0.12)" fill="#d6334a"/>
      <use href="#diamond" transform="translate(-7 7) scale(0.12)" fill="#d6334a"/>
      <use href="#club" transform="translate(7 7) scale(0.12)" fill="#1b1530"/>
    </g>
    <clipPath id="inner">
      <rect x="-108" y="-164" width="216" height="328" rx="16"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1a0f4a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <g transform="translate(256 256) scale(1) translate(-256 -256)">
  <g transform="translate(256 262) rotate(-8)">
    <!-- card -->
    <rect x="-122" y="-178" width="244" height="356" rx="26" fill="#fff" filter="url(#shadow)"/>
    <rect x="-108" y="-164" width="216" height="328" rx="16" fill="#fbf8ff"/>

    <!-- portrait -->
    <g clip-path="url(#inner)">
      <!-- hair behind -->
      <g fill="#8a4b1e">
        <ellipse cx="0" cy="-36" rx="56" ry="50"/>
        <circle cx="-48" cy="-8" r="17"/><circle cx="-50" cy="16" r="15"/>
        <circle cx="48" cy="-8" r="17"/><circle cx="50" cy="16" r="15"/>
      </g>
      <!-- neck -->
      <rect x="-15" y="18" width="30" height="56" fill="#efbb92"/>
      <!-- tunic -->
      <path d="M-108,170 L-108,112 C-100,84 -72,70 -42,64 L42,64 C72,70 100,84 108,112 L108,170 Z" fill="#d6334a"/>
      <path d="M-108,112 C-100,84 -72,70 -42,64 L-30,96 C-62,100 -90,112 -108,132 Z" fill="#2f5fd0"/>
      <path d="M108,112 C100,84 72,70 42,64 L30,96 C62,100 90,112 108,132 Z" fill="#2f5fd0"/>
      <path d="M0,104 L0,170" stroke="#f0a500" stroke-width="6"/>
      <circle cx="0" cy="128" r="5" fill="url(#gold)"/>
      <circle cx="0" cy="150" r="5" fill="url(#gold)"/>
      <!-- collar band with all four suits -->
      <path d="M-66,64 Q0,104 66,64 L62,90 Q0,132 -62,90 Z" fill="url(#gold)" stroke="#b87a00" stroke-width="3" stroke-linejoin="round"/>
      <use href="#spade" transform="translate(-38 84) scale(0.15)" fill="#1b1530"/>
      <use href="#heart" transform="translate(-13 96) scale(0.15)" fill="#d6334a"/>
      <use href="#diamond" transform="translate(13 96) scale(0.15)" fill="#d6334a"/>
      <use href="#club" transform="translate(38 84) scale(0.15)" fill="#1b1530"/>

      <!-- face -->
      <ellipse cx="0" cy="-18" rx="44" ry="52" fill="#f6cfa8"/>
      <path d="M-46,-42 C-30,-64 30,-64 46,-42 C30,-52 12,-50 0,-40 C-12,-50 -30,-52 -46,-42 Z" fill="#8a4b1e"/>
      <circle cx="-26" cy="-4" r="8" fill="#f29a9a" opacity="0.55"/>
      <circle cx="26" cy="-4" r="8" fill="#f29a9a" opacity="0.55"/>
      <g fill="none" stroke="#6b3a14" stroke-width="4" stroke-linecap="round">
        <path d="M-30,-36 Q-18,-44 -6,-37"/>
        <path d="M30,-36 Q18,-44 6,-37"/>
      </g>
      <ellipse cx="-17" cy="-24" rx="5.5" ry="6.5" fill="#1b1530"/>
      <ellipse cx="17" cy="-24" rx="5.5" ry="6.5" fill="#1b1530"/>
      <circle cx="-15.5" cy="-26.5" r="1.8" fill="#fff"/>
      <circle cx="18.5" cy="-26.5" r="1.8" fill="#fff"/>
      <path d="M0,-20 Q-6,-6 0,-2" fill="none" stroke="#d99a72" stroke-width="3" stroke-linecap="round"/>
      <path d="M-17,10 Q0,25 17,10" fill="none" stroke="#8a2f2f" stroke-width="4" stroke-linecap="round"/>

      <!-- feathered cap -->
      <path d="M36,-80 C56,-106 70,-136 98,-152 C96,-118 80,-92 52,-68 Z" fill="#ff7a59" stroke="#c4472a" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M42,-74 C62,-98 78,-126 96,-148" fill="none" stroke="#c4472a" stroke-width="2"/>
      <path d="M-62,-56 C-64,-100 60,-106 66,-60 C40,-74 -40,-74 -62,-56 Z" fill="#2f5fd0"/>
      <path d="M-62,-58 C-40,-74 40,-74 66,-62 L64,-48 C40,-62 -40,-62 -60,-44 Z" fill="url(#gold)" stroke="#b87a00" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="0" cy="-60" r="6" fill="#d6334a" stroke="#b87a00" stroke-width="2"/>
    </g>
    <rect x="-108" y="-164" width="216" height="328" rx="16" fill="none" stroke="#e7e2f7" stroke-width="3"/>

    <!-- corner indices: J plus all four suits -->
    <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="54" fill="#1b1530" text-anchor="middle">
      <text x="-82" y="-112">J</text>
      <use href="#suits" transform="translate(-82 -88)"/>
      <g transform="rotate(180)">
        <rect x="-106" y="-162" width="48" height="90" rx="10" fill="#fbf8ff"/>
        <text x="-82" y="-112">J</text>
        <use href="#suits" transform="translate(-82 -88)"/>
      </g>
    </g>
  </g>

  </g>
</svg>
