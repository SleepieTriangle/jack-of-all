<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jack of All</title>
    <meta name="description" content="A new brain game every week. Gets harder every day. Keeps every part of your mind sharp." />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#6c4cf1" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="icons/icon-mark.svg" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Jack of All" />
    <link rel="preload" href="fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to content</a>
    <header class="topbar">
      <a class="brand" href="#/home" aria-label="Jack of All home">
        <img class="brand-mark" src="icons/icon-mark.svg" alt="" width="38" height="38" />
        <span class="brand-name">Jack of All</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="#/home" data-nav="home"><span class="nav-ico" aria-hidden="true">🏠</span><span class="nav-txt">This Week</span></a>
        <a href="#/library" data-nav="library"><span class="nav-ico" aria-hidden="true">🎯</span><span class="nav-txt">Practice</span></a>
        <a href="#/progress" data-nav="progress"><span class="nav-ico" aria-hidden="true">📈</span><span class="nav-txt">Progress</span></a>
        <a href="#/friends" data-nav="friends"><span class="nav-ico" aria-hidden="true">🤝</span><span class="nav-txt">Friends</span></a>
        <a href="#/settings" data-nav="settings"><span class="nav-ico" aria-hidden="true">⚙️</span><span class="nav-txt">Settings</span></a>
        <button class="install-btn" id="install-btn" hidden>⬇ Install</button>
        <a class="who" id="who" href="#/players" hidden></a>
      </nav>
    </header>

    <div class="update-bar" id="update-bar" role="status" hidden>
      ✨ A new version of Jack of All is ready.
      <button class="btn small" id="update-now">Refresh</button>
    </div>

    <main id="app" class="container" tabindex="-1"></main>

    <div id="modal" class="modal" hidden></div>

    <script src="js/core.js"></script>
    <script src="js/games/chess.js"></script>
    <script src="js/games/sudoku.js"></script>
    <script src="js/games/wordProblems.js"></script>
    <script src="js/games/patterns.js"></script>
    <script src="js/games/memory.js"></script>
    <script src="js/games/scramble.js"></script>
    <script src="js/games/colorClash.js"></script>
    <script src="js/games/sliding.js"></script>
    <script src="js/games/lightTrail.js"></script>
    <script src="js/games/quickMath.js"></script>
    <script src="js/games/oddOneOut.js"></script>
    <script src="js/games/numberHunt.js"></script>
    <script src="js/games/shapeSpin.js"></script>
    <script src="js/games/matchBack.js"></script>
    <script src="js/games/oddWord.js"></script>
    <script src="js/social.js"></script>
    <script src="js/badges.js"></script>
    <script src="js/fx.js"></script>
    <script src="js/install.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
